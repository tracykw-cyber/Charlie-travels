    <!-- two side toe beans -->
    <ellipse cx="5.2" cy="12.5" rx="2.1" ry="2.6"/>
    <ellipse cx="18.8" cy="12.5" rx="2.1" ry="2.6"/>
    <!-- main pad -->
    <path d="M7 20c0-2.9 2.2-5.2 5-5.2s5 2.3 5 5.2a3.6 3.6 0 0 1-3.6 3.6H10.6A3.6 3.6 0 0 1 7 20z"/>
